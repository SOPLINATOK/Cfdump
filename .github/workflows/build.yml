name: build
on: [push, workflow_dispatch]
jobs:
  ndk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S . -B out -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release
          cmake --build out
      - uses: actions/upload-artifact@v4
        with:
          name: libcfdump
          path: out/libcfdump.so
